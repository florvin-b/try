name: Deploy on Tag

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show tag
        run: |
          echo "Tag: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"

      - name: Deploy
        run: |
          echo "Deploying version $GITHUB_REF_NAME"
